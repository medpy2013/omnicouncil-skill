<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">OmniCouncil review and delivery flow</title><desc id="desc">Six stages: specialist framing, engineer proposal, devil’s advocate, skeptical user, revision, and maestro delivery, with evidence checks throughout.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f1f5ff"/><stop offset="1" stop-color="#f4fbf8"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7890ad"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.card{fill:#fff;stroke:#d9e2ef;stroke-width:2}.step{font-size:14px;font-weight:700;letter-spacing:1px;fill:#536982}.label{font-size:18px;font-weight:700;fill:#142438}.detail{font-size:13px;fill:#465a70}.conn{stroke:#7890ad;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1200" height="390" rx="24" fill="url(#bg)"/><text x="600" y="48" text-anchor="middle" font-size="25" font-weight="750" fill="#142438">From first proposal to checked delivery</text><text x="600" y="76" text-anchor="middle" font-size="14" fill="#536982">A concise review method with evidence checks, not independent human experts</text><g transform="translate(38 112)"><rect class="card" x="0" y="0" width="170" height="132" rx="16"/><text class="step" x="18" y="27">01 · FRAME</text><text class="label" x="18" y="58">Specialist</text><text class="detail" x="18" y="83"><tspan x="18">Principle and evidence</tspan><tspan x="18" dy="19">plus key unknowns</tspan></text><path class="conn" d="M174 66 H198"/><rect class="card" x="200" y="0" width="170" height="132" rx="16"/><text class="step" x="218" y="27">02 · PROPOSE</text><text class="label" x="218" y="58">Engineer</text><text class="detail" x="218" y="83"><tspan x="218">Concrete first approach</tspan><tspan x="218" dy="19">matched to the task</tspan></text><path class="conn" d="M374 66 H398"/><rect class="card" x="400" y="0" width="170" height="132" rx="16"/><text class="step" x="418" y="27">03 · CHALLENGE</text><text class="label" x="418" y="58">Advocate</text><text class="detail" x="418" y="83"><tspan x="418">Test strongest plausible</tspan><tspan x="418" dy="19">failure mode</tspan></text><path class="conn" d="M574 66 H598"/><rect class="card" x="600" y="0" width="170" height="132" rx="16"/><text class="step" x="618" y="27">04 · TEST USE</text><text class="label" x="618" y="58">Skeptical user</text><text class="detail" x="618" y="83"><tspan x="618">Clarity, effort, and</tspan><tspan x="618" dy="19">likely confusion</tspan></text><path class="conn" d="M774 66 H798"/><rect class="card" x="800" y="0" width="170" height="132" rx="16"/><text class="step" x="818" y="27">05 · REVISE</text><text class="label" x="818" y="58">Resolution</text><text class="detail" x="818" y="83"><tspan x="818">Fix valid flaws;</tspan><tspan x="818" dy="19">bound what remains</tspan></text><path class="conn" d="M974 66 H998"/><rect class="card" x="1000" y="0" width="170" height="132" rx="16"/><text class="step" x="1018" y="27">06 · DELIVER</text><text class="label" x="1018" y="58">Maestro</text><text class="detail" x="1018" y="83"><tspan x="1018">Usable result and</tspan><tspan x="1018" dy="19">honest verification</tspan></text></g><rect x="38" y="278" width="1132" height="74" rx="16" fill="#173a5e"/><text x="64" y="308" font-size="13" font-weight="700" letter-spacing="1" fill="#9fd6c4">FACTUALITY CHECK</text><text x="64" y="334" font-size="16" font-weight="600" fill="#fff">Neutral claim checks · source evidence · counterevidence · calculations and quotes · explicit unknowns</text></svg>
